<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><strong>Flip Card Gallery</strong></h1>
    <p><small><i>Hover a card to see the back</i></small></p>
    <div class="gallery">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <div class="icon">📡</div>
                        <h3>HTML</h3>
                </div>
                <div class="flip-card-back">
                    <h3>HTML</h3>
                    <p>Structure</p>
                </div>
            </div>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <div class="icon">🎨</div>
                        <h3>CSS</h3>
                </div>
                <div class="flip-card-back">
                    <h3>CSS</h3>
                    <p>Design</p>
                </div>
            </div>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <div class="icon">⚡</div>
                        <h3>JavaScript</h3>
                </div>
                <div class="flip-card-back">
                    <h3>JavaScript</h3>
                    <p>process the logic</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
